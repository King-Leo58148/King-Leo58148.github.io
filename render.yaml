services:
  - type: web
    name: king-leo58148-portfolio-api
    runtime: python
    rootDir: Backend
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_if_empty && gunicorn Backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
