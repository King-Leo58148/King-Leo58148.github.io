name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://king-leo58148-github-io.onrender.com/portfolio/hero/)
          echo "HTTP status: $status"
          test "$status" -eq 200
