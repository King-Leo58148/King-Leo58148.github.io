<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Portfolio Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a192f;
      --surface: #112240;
      --border: #1d3461;
      --text: #ccd6f6;
      --white: #e6f1ff;
      --muted: #8892b0;
      --accent: #64ffda;
      --danger: #ff6b81;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #112240 0%, #0a192f 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 24px 60px rgba(2, 12, 27, 0.65);
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(100, 255, 218, 0.1);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--white);
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    .error {
      background: rgba(255, 107, 129, 0.12);
      border: 1px solid rgba(255, 107, 129, 0.4);
      color: #ffb3be;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.45rem;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 1.15rem;
      transition: border-color 180ms;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #0a192f;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 180ms, transform 120ms;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.99); }
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Portfolio Studio</span>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your admin account to manage your portfolio.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Sign In</button>
    </form>
    <a class="footer-link" href="https://king-leo58148.github.io" target="_blank" rel="noopener">View Live Portfolio &rarr;</a>
  </div>
</body>
</html>
