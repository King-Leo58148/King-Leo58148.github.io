{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('Portfolio Admin') }}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --primary: #112240;
    --secondary: #0a192f;
    --accent: #64ffda;
    --primary-fg: #e6f1ff;
    --body-fg: #ccd6f6;
    --body-bg: #0a192f;
    --body-quiet-color: #8892b0;
    --body-loud-color: #e6f1ff;
    --header-color: #e6f1ff;
    --header-branding-color: #64ffda;
    --header-bg: #112240;
    --header-link-color: #ccd6f6;
    --breadcrumbs-fg: #8892b0;
    --breadcrumbs-link-fg: #64ffda;
    --breadcrumbs-bg: #0d1f3a;
    --link-fg: #64ffda;
    --link-hover-color: #a8ffeb;
    --link-selected-fg: #64ffda;
    --hairline-color: #1d3461;
    --border-color: #1d3461;
    --darkened-bg: #112240;
    --selected-bg: #1d3461;
    --selected-row: #172a45;
    --button-fg: #0a192f;
    --button-bg: #64ffda;
    --button-hover-bg: #8affdf;
    --default-button-bg: #64ffda;
    --default-button-hover-bg: #8affdf;
    --close-button-bg: #1d3461;
    --close-button-hover-bg: #294882;
    --delete-button-bg: #e05260;
    --delete-button-hover-bg: #f06573;
    --object-tools-fg: #0a192f;
    --object-tools-bg: #64ffda;
    --object-tools-hover-bg: #8affdf;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  #header {
    border-bottom: 1px solid #1d3461;
    padding: 14px 28px;
  }

  #branding h1 {
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .module, .inline-group, #changelist-filter {
    border-radius: 10px;
    border: 1px solid #1d3461;
    overflow: hidden;
    background: #112240;
  }

  .module h2, .module caption, .inline-group h2 {
    background: #172a45;
    color: #e6f1ff;
    font-weight: 600;
    padding: 10px 14px;
    letter-spacing: 0.02em;
  }

  div.breadcrumbs {
    border-bottom: 1px solid #1d3461;
    padding: 10px 28px;
  }

  input[type=text], input[type=password], input[type=email], input[type=url],
  input[type=number], textarea, select, .vTextField {
    background: #0a192f;
    color: #e6f1ff;
    border: 1px solid #233554;
    border-radius: 6px;
    padding: 8px 10px;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #64ffda;
    outline: none;
  }

  .button, input[type=submit], input[type=button], .submit-row input, a.button {
    border-radius: 6px;
    font-weight: 600;
    padding: 9px 16px;
  }

  .submit-row {
    background: #112240;
    border: 1px solid #1d3461;
    border-radius: 10px;
    padding: 12px 16px;
  }

  .login #container {
    background: #112240;
    border: 1px solid #1d3461;
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name"><a href="{% url 'admin:index' %}">{{ site_header|default:_('Louis Portfolio Admin') }}</a></div>
{% endblock %}
